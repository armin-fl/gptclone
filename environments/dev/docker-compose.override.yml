  vllm-flux:
    build:
      context: ./vllm-omni
    image: vllm-omni:gptclone-v0.20.0
    container_name: vllm-flux-dev
    profiles: ["flux"]
    restart: "no"
    ipc: host
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vllm-warm-sleep-entrypoint
    environment:
      <<: *vllm-warm-sleep-env
      HF_HOME: /root/.cache/huggingface
      GPTCLONE_WARM_SLEEP_API: omni
      GPTCLONE_OMNI_SLEEP_STAGE_IDS: "${FLUX_SLEEP_STAGE_IDS:-0}"
      GPTCLONE_PATCH_OMNI_SLEEP_STATE: "1"
    ports:
      - "127.0.0.1:8005:8000"
    volumes:
      - ./vllm/warm-sleep-entrypoint.sh:/usr/local/bin/vllm-warm-sleep-entrypoint:ro
      - ../../data/huggingface:/root/.cache/huggingface
      - ${FLUX_MODEL_PATH:-../../models/Vllm/FLUX.2-klein-base-4B}:/models/flux:ro
    command:
      - /models/flux
      - --omni
      - --served-model-name
      - flux
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --gpu-memory-utilization
      - "${VLLM_FLUX_GPU_MEMORY_UTILIZATION:-0.80}"
      - --enable-sleep-mode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck: *vllm-warm-sleep-healthcheck

  vllm-qwen3-vl-embedding-2b:
    image: vllm:gptclone
    container_name: vllm-qwen3-vl-embedding-2b-dev
    restart: unless-stopped
    ipc: host
    environment:
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: Authorization=Basic cGstbGYtZGV2LXByb2plY3Qta2V5OnNrLWxmLWRldi1zZWNyZXQta2V5,x-langfuse-ingestion-version=4
      OTEL_SERVICE_NAME: vllm-qwen3-vl-embedding-2b
    ports:
      - "127.0.0.1:8011:8000"
    volumes:
      - ../../data/huggingface:/root/.cache/huggingface
      - ${QWEN3_VL_EMBEDDING_2B_MODEL_PATH:-../../models/Vllm/Qwen3-VL-Embedding-2B}:/models/qwen3-vl-embedding-2b:ro
    command:
      - --model
      - /models/qwen3-vl-embedding-2b
      - --served-model-name
      - qwen3-vl-embedding-2b
      - --runner
      - pooling
      - --dtype
      - auto
      - --cpu-offload-gb
      - "${RAG_EMBEDDING_CPU_OFFLOAD_GB:-1}"
      - --max-model-len
      - "${RAG_EMBEDDING_MAX_MODEL_LEN:-2048}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN3_VL_EMBEDDING_2B_GPU_MEMORY_UTILIZATION:-0.105}"
      - --language-model-only
      - --enforce-eager
      - --otlp-traces-endpoint
      - http://langfuse-web:3000/api/public/otel/v1/traces
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 5s

  vllm-qwen3-vl-reranker-2b:
    image: vllm:gptclone
    container_name: vllm-qwen3-vl-reranker-2b-dev
    restart: unless-stopped
    ipc: host
    depends_on:
      vllm-qwen3-vl-embedding-2b:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: Authorization=Basic cGstbGYtZGV2LXByb2plY3Qta2V5OnNrLWxmLWRldi1zZWNyZXQta2V5,x-langfuse-ingestion-version=4
      OTEL_SERVICE_NAME: vllm-qwen3-vl-reranker-2b
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - ../../data/huggingface:/root/.cache/huggingface
      - ${QWEN3_VL_RERANKER_2B_MODEL_PATH:-../../models/Vllm/Qwen3-VL-Reranker-2B}:/models/qwen3-vl-reranker-2b:ro
    command:
      - --model
      - /models/qwen3-vl-reranker-2b
      - --served-model-name
      - qwen3-vl-reranker-2b
      - --runner
      - pooling
      - --hf-overrides
      - '{"architectures":["Qwen3VLForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /models/qwen3-vl-reranker-2b/additional_chat_templates/reranker.jinja
      - --dtype
      - auto
      - --cpu-offload-gb
      - "${RAG_RERANK_CPU_OFFLOAD_GB:-1}"
      - --max-model-len
      - "${RAG_RERANK_MAX_MODEL_LEN:-2048}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN3_VL_RERANKER_2B_GPU_MEMORY_UTILIZATION:-0.105}"
      - --language-model-only
      - --enforce-eager
      - --otlp-traces-endpoint
      - http://langfuse-web:3000/api/public/otel/v1/traces
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 5s

  vllm-gpt-oss-20b:
    image: vllm:gptclone
    container_name: vllm-gpt-oss-20b-dev
    restart: "no"
    ipc: host
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vllm-warm-sleep-entrypoint
    environment:
      <<: *vllm-warm-sleep-env
      VLLM_SERVER_DEV_MODE: "1"
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: Authorization=Basic cGstbGYtZGV2LXByb2plY3Qta2V5OnNrLWxmLWRldi1zZWNyZXQta2V5,x-langfuse-ingestion-version=4
      OTEL_SERVICE_NAME: vllm-gpt-oss-20b
      TIKTOKEN_RS_CACHE_DIR: /root/.cache/tiktoken-rs-cache
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./vllm/warm-sleep-entrypoint.sh:/usr/local/bin/vllm-warm-sleep-entrypoint:ro
      - ../../data/huggingface:/root/.cache/huggingface
      - ../../data/tiktoken-rs-cache:/root/.cache/tiktoken-rs-cache
      - ../../models/Vllm/OpenAI:/models/gpt-oss-20b:ro
    command:
      - --model
      - /models/gpt-oss-20b
      - --served-model-name
      - gpt-oss-20b
      - --dtype
      - auto
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "${VLLM_GPT_OSS_20B_GPU_MEMORY_UTILIZATION:-0.60}"
      - --enable-sleep-mode
      - --otlp-traces-endpoint
      - http://langfuse-web:3000/api/public/otel/v1/traces
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck: *vllm-warm-sleep-healthcheck

  vllm-qwen3-32b-awq:
    image: vllm:gptclone
    container_name: vllm-qwen3-32b-awq-dev
    restart: "no"
    ipc: host
    depends_on:
      vllm-gpt-oss-20b:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vllm-warm-sleep-entrypoint
    environment:
      <<: *vllm-warm-sleep-env
      VLLM_SERVER_DEV_MODE: "1"
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: Authorization=Basic cGstbGYtZGV2LXByb2plY3Qta2V5OnNrLWxmLWRldi1zZWNyZXQta2V5,x-langfuse-ingestion-version=4
      OTEL_SERVICE_NAME: vllm-qwen3-32b-awq
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./vllm/warm-sleep-entrypoint.sh:/usr/local/bin/vllm-warm-sleep-entrypoint:ro
      - ../../data/huggingface:/root/.cache/huggingface
      - ../../models/Vllm/Qwen3-32B-AWQ:/models/qwen3-32b-awq:ro
    command:
      - --model
      - /models/qwen3-32b-awq
      - --served-model-name
      - qwen3-32b-awq
      - --dtype
      - auto
      - --cpu-offload-gb
      - "0"
      - --offload-group-size
      - "0"
      - --gpu-memory-utilization
      - "${VLLM_32B_GPU_MEMORY_UTILIZATION:-0.66}"
      - --max-model-len
      - "32768"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "${VLLM_32B_MAX_NUM_SEQS:-2}"
      - --enforce-eager
      - --enable-sleep-mode
      - --otlp-traces-endpoint
      - http://langfuse-web:3000/api/public/otel/v1/traces
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck: *vllm-warm-sleep-healthcheck

