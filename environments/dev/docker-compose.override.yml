x-vllm-warm-sleep-env: &vllm-warm-sleep-env
  GPTCLONE_WARM_SLEEP_ON_START: "${GPTCLONE_WARM_SLEEP_ON_START:-1}"
  GPTCLONE_WARM_SLEEP_LEVEL: "${GPTCLONE_WARM_SLEEP_LEVEL:-1}"
  GPTCLONE_WARMUP_TIMEOUT_SECONDS: "${GPTCLONE_WARMUP_TIMEOUT_SECONDS:-900}"
  GPTCLONE_WARMUP_POLL_SECONDS: "${GPTCLONE_WARMUP_POLL_SECONDS:-2}"

x-vllm-warm-sleep-healthcheck: &vllm-warm-sleep-healthcheck
  test: ["CMD-SHELL", "test -f /tmp/vllm-warm-sleep-ready && curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
  interval: 10s
  timeout: 5s
  retries: 90
  start_period: 5s

services:



