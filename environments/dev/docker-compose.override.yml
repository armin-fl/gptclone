services:
  ollama-qwen3-14b:
    image: ollama/ollama:latest
    container_name: ollama-qwen3-14b-dev
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ../../models/Ollama/Qwen3-14b:/root/.ollama/models
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-gpt-oss-20b:
    image: vllm:gptclone
    container_name: vllm-gpt-oss-20b-dev
    restart: unless-stopped
    ipc: host
    environment:
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: Authorization=Basic cGstbGYtZGV2LXByb2plY3Qta2V5OnNrLWxmLWRldi1zZWNyZXQta2V5,x-langfuse-ingestion-version=4
      OTEL_SERVICE_NAME: vllm-gpt-oss-20b
    ports:
      - "8001:8000"
    volumes:
      - ../../data/huggingface:/root/.cache/huggingface
      - ../../models/OpenAI:/models/gpt-oss-20b:ro
    depends_on:
      langfuse-web:
        condition: service_started
    command:
      - --model
      - /models/gpt-oss-20b
      - --served-model-name
      - gpt-oss-20b
      - --dtype
      - auto
      - --otlp-traces-endpoint
      - http://langfuse-web:3000/api/public/otel/v1/traces
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
