  vllm-qwen3-32b-awq:
    image: vllm:gptclone
    container_name: vllm-qwen3-32b-awq-dev
    profiles: ["qwen3-32b-awq"]
    restart: unless-stopped
    ipc: host
    environment:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: Authorization=Basic cGstbGYtZGV2LXByb2plY3Qta2V5OnNrLWxmLWRldi1zZWNyZXQta2V5,x-langfuse-ingestion-version=4
      OTEL_SERVICE_NAME: vllm-qwen3-32b-awq
    ports:
      - "8002:8000"
    volumes:
      - ../../data/huggingface:/root/.cache/huggingface
      - ../../models/Vllm/Qwen3-32B-AWQ:/models/qwen3-32b-awq:ro
    command:
      - --model
      - /models/qwen3-32b-awq
      - --served-model-name
      - qwen3-32b-awq
      - --dtype
      - auto
      - --cpu-offload-gb
      - "0"
      - --offload-group-size
      - "0"
      - --gpu-memory-utilization
      - "0.82"
      - --max-model-len
      - "40960"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "1"
      - --enforce-eager
      - --otlp-traces-endpoint
      - http://langfuse-web:3000/api/public/otel/v1/traces
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

